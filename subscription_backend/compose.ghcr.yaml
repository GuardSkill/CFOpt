services:
  subscription:
    image: ghcr.io/guardskill/cfopt-sub:latest
    pull_policy: always
    container_name: cfopt-sub
    restart: unless-stopped
    env_file:
      - path: ./data/outbound.env
        required: false
    ports:
      - "${CFOPT_BIND_ADDRESS:-192.168.0.122}:${CFOPT_HOST_PORT:-19090}:8787"
    volumes:
      - ./data:/data:rw
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
