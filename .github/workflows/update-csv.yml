name: Update CFOpt CSVs

on:
  schedule:
    # GitHub Actions uses UTC: 20:00 UTC = 04:00 UTC+8 on the next day.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: Benchmark runner
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-cd
          - linux-bj

permissions:
  contents: write

concurrency:
  group: cfopt-csv-publisher
  cancel-in-progress: false

jobs:
  windows-cd:
    if: github.event_name == 'schedule' || inputs.runner == 'all' || inputs.runner == 'windows-cd'
    runs-on: [self-hosted, windows, x64, cfopt, chengdu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        env:
          # Self-hosted China routes are more reliable over HTTP/1.1, and the
          # benchmark publishes through the Contents API rather than Git.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        with:
          fetch-depth: 1

      - name: Use preinstalled Python
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $candidates = @(
            (Get-Command python.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            'H:\CodeApp\Anaconda\python.exe',
            "$env:LOCALAPPDATA\Programs\Python\Python313\python.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -Unique
          $python = $candidates | Select-Object -First 1
          if (-not $python) {
            throw 'Python is required on the Chengdu runner. Install it system-wide or update the known candidate paths.'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $python)
          & $python --version

      - name: Install CloudflareSpeedTest
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $headers = @{
            'Accept' = 'application/vnd.github+json'
            'User-Agent' = 'CFOpt-Actions'
            'Authorization' = "Bearer $env:GH_TOKEN"
          }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri 'https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest'
          $asset = @($release.assets | Where-Object { $_.name -eq 'cfst_windows_amd64.zip' })
          if ($asset.Count -ne 1) {
            $available = ($release.assets.name -join ', ')
            throw "Expected one Windows x64 CFST asset, got $($asset.Count). Available assets: $available"
          }

          $binDir = Join-Path $env:GITHUB_WORKSPACE '.cfopt-runner\bin'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE '.cfopt-runner\cfst.zip'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          & curl.exe `
            --fail `
            --location `
            --retry 5 `
            --retry-delay 10 `
            --retry-all-errors `
            --user-agent 'CFOpt-Actions' `
            --output $zipPath `
            $asset[0].browser_download_url
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download CloudflareSpeedTest asset; curl exit code $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $zipPath) -or (Get-Item -LiteralPath $zipPath).Length -eq 0) {
            throw 'CloudflareSpeedTest download was empty'
          }

          Expand-Archive -LiteralPath $zipPath -DestinationPath $binDir -Force
          $targetCfst = Join-Path $binDir 'cfst.exe'
          $extractedCfst = Get-ChildItem -LiteralPath $binDir -Recurse -File -Filter 'cfst.exe' | Select-Object -First 1
          if (-not $extractedCfst) { throw 'CFST archive did not contain cfst.exe' }
          if ($extractedCfst.FullName -ne $targetCfst) {
            Copy-Item -LiteralPath $extractedCfst.FullName -Destination $targetCfst -Force
          }

      - name: Benchmark Chengdu and publish the detected carrier CSV
        shell: powershell
        env:
          GITHUB_TOKEN_CFOPT: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\windows\Invoke-CFOptAutoPush.ps1' `
            -WorkDir "$env:RUNNER_TEMP\cfopt-cd" `
            -CfstPath "$env:GITHUB_WORKSPACE\.cfopt-runner\bin\cfst.exe" `
            -Force `
            -AutoDetectNetworkIsp `
            -NetworkIspFallback ChinaTelecom
          if ($LASTEXITCODE -ne 0) { throw "CFOpt Windows runner exited with code $LASTEXITCODE" }

  linux-bj:
    if: github.event_name == 'schedule' || inputs.runner == 'all' || inputs.runner == 'linux-bj'
    runs-on: [self-hosted, linux, x64, cfopt, beijing]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.version
          GIT_CONFIG_VALUE_0: HTTP/1.1
        with:
          fetch-depth: 1

      - name: Install CloudflareSpeedTest
        shell: bash
        run: |
          set -euo pipefail
          asset_url="$(python3 - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "CFOpt-Actions"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          matches = [
              asset["browser_download_url"]
              for asset in release["assets"]
              if asset["name"].endswith("linux_amd64.tar.gz")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one linux_amd64 CFST asset, found {len(matches)}")
          print(matches[0])
          PY
          )"
          mkdir -p .cfopt-runner/bin
          curl --fail --location --retry 3 --output .cfopt-runner/cfst.tar.gz "$asset_url"
          tar -xzf .cfopt-runner/cfst.tar.gz -C .cfopt-runner/bin
          extracted_cfst="$(find .cfopt-runner/bin -type f -name cfst -print -quit)"
          if [[ -z "$extracted_cfst" ]]; then
            echo "CFST archive did not contain a cfst executable" >&2
            exit 1
          fi
          if [[ "$extracted_cfst" != ".cfopt-runner/bin/cfst" ]]; then
            cp "$extracted_cfst" .cfopt-runner/bin/cfst
          fi
          chmod +x .cfopt-runner/bin/cfst

      - name: Benchmark Beijing CMCC and publish its CSV
        shell: bash
        env:
          GITHUB_TOKEN_CFOPT: ${{ github.token }}
          WORK_DIR: ${{ runner.temp }}/cfopt-bj
          CFST_PATH: ${{ github.workspace }}/.cfopt-runner/bin/cfst
          TARGET_PATH: CMCC_BJ.csv
          TEST_LOCATION_NAME: BJ
          FORCE: "1"
          DISABLE_PROXYIP_BEST: "1"
        run: bash scripts/linux/invoke-cfopt-auto-push-linux.sh
