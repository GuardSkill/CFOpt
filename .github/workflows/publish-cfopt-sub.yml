name: Publish CFOpt subscription image

on:
  push:
    branches: [main]
    tags: ["cfopt-sub-v*"]
    paths:
      - subscription_backend/server.py
      - subscription_backend/Dockerfile
      - .github/workflows/publish-cfopt-sub.yml
  pull_request:
    paths:
      - subscription_backend/server.py
      - subscription_backend/Dockerfile
      - subscription_backend/test_server.py
      - .github/workflows/publish-cfopt-sub.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: guardskill/cfopt-sub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run backend regression tests
        run: python -m unittest discover -s subscription_backend -p test_server.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: subscription_backend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
